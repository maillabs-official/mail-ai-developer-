<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAIL AI Developer</title><style>body{font:16px system-ui;background:#101827;color:#fff;margin:0}header{padding:20px;background:#1e293b;font-size:22px;font-weight:700}main{padding:16px}input,select,textarea,button{box-sizing:border-box;width:100%;padding:13px;margin:7px 0;border:1px solid #475569;border-radius:10px;background:#1e293b;color:#fff;font:inherit}button{background:#2563eb;border:0}#messages{height:44vh;overflow:auto;white-space:pre-wrap;border:1px solid #334155;border-radius:10px;padding:12px}.bubble{margin:10px 0;padding:12px;border-radius:12px;background:#334155}.me{background:#1d4ed8}</style></head><body><header>MAIL AI Developer</header><main><label>Server HTTPS</label><input id="url" placeholder="https://server.example.com"><label>Model</label><select id="model"><option value="nemotron">NVIDIA Nemotron</option><option value="claude" disabled>Claude (belum terhubung)</option><option value="gpt" disabled>GPT (belum terhubung)</option></select><button id="test">Uji koneksi</button><div id="messages" aria-live="polite"></div><textarea id="prompt" rows="3" placeholder="Tulis perintah untuk AI"></textarea><button id="send">Kirim</button><button id="clear">Hapus riwayat</button></main><script>
const $=id=>document.getElementById(id), saved=JSON.parse(localStorage.getItem('mail-history')||'[]');let messages=saved;
$('url').value=localStorage.getItem('mail-url')||'';
function render(){ $('messages').replaceChildren();for(const m of messages){let el=document.createElement('div');el.className='bubble '+(m.role==='user'?'me':'');el.textContent=(m.role==='user'?'Saya: ':'AI: ')+m.content;$('messages').append(el)}$('messages').scrollTop=$('messages').scrollHeight;localStorage.setItem('mail-history',JSON.stringify(messages.slice(-50)));}
async function ask(message){const base=$('url').value.trim().replace(/\/$/,'');if(!/^https:\/\//.test(base)){alert('Gunakan alamat server HTTPS yang valid');return;}localStorage.setItem('mail-url',base);messages.push({role:'user',content:message});render();$('send').disabled=true;try{const r=await fetch(base+'/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message,model:$('model').value})});const data=await r.json();if(!r.ok)throw Error(data.error||'HTTP '+r.status);messages.push({role:'assistant',content:String(data.reply||data.response||'Server tidak mengirim jawaban')});}catch(e){messages.push({role:'assistant',content:'Koneksi gagal: '+e.message});}finally{$('send').disabled=false;render();}}
$('send').onclick=()=>{const t=$('prompt').value.trim();if(t){$('prompt').value='';ask(t);}};
$('test').onclick=()=>ask('Jawab OK jika koneksi AI berfungsi.');
$('clear').onclick=()=>{messages=[];render();};render();
</script></body></html>
